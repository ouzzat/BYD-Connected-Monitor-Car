plugins {
    id 'com.android.application'
}

android {
    namespace 'ma.asmontec.bydmonitor.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'ma.asmontec.bydmonitor.mobile'
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName '1.1.0-background-mqtt'
    }

    buildTypes {
        debug { debuggable true }
        release {
            debuggable false
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}
