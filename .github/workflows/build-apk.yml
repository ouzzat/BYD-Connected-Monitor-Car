name: Build WebRTC Android APKs

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract WebRTC project
        run: |
          base64 -d android-project.zip.b64 > /tmp/byd-webrtc.zip
          unzip -q /tmp/byd-webrtc.zip
          test -f byd-connected-monitor/gradlew

      - name: Apply Metered Realtime integration
        run: |
          git -C byd-connected-monitor apply --check ../.github/patches/metered-realtime.patch
          git -C byd-connected-monitor apply ../.github/patches/metered-realtime.patch

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build Metered WebRTC APKs
        working-directory: byd-connected-monitor
        run: |
          chmod +x gradlew
          ./gradlew \
            :car-agent:app:assembleDebug \
            :mobile-app:app:assembleDebug \
            --no-daemon

      - name: Verify, rename and checksum APKs
        working-directory: byd-connected-monitor
        run: |
          CAR_APK="car-agent/app/build/outputs/apk/debug/app-debug.apk"
          MOBILE_APK="mobile-app/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$CAR_APK"
          test -f "$MOBILE_APK"
          unzip -t "$CAR_APK"
          unzip -t "$MOBILE_APK"
          mkdir -p dist
          cp "$CAR_APK" dist/BYD-Car-WebRTC-Metered-debug.apk
          cp "$MOBILE_APK" dist/BYD-Mobile-WebRTC-Metered-debug.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Upload Metered WebRTC APKs
        uses: actions/upload-artifact@v4
        with:
          name: BYD-WebRTC-Metered-APKs
          path: byd-connected-monitor/dist/*
          if-no-files-found: error
