name: Build WebRTC Android APKs v1

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract WebRTC project
        run: |
          base64 -d android-project.zip.b64 > /tmp/byd-webrtc.zip
          unzip -q /tmp/byd-webrtc.zip
          test -f byd-connected-monitor/gradlew

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build WebRTC APKs
        working-directory: byd-connected-monitor
        run: |
          chmod +x gradlew
          ./gradlew \
            :car-agent:app:assembleDebug \
            :mobile-app:app:assembleDebug \
            --no-daemon

      - name: Verify and checksum APKs
        working-directory: byd-connected-monitor
        run: |
          CAR_APK="car-agent/app/build/outputs/apk/debug/app-debug.apk"
          MOBILE_APK="mobile-app/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$CAR_APK"
          test -f "$MOBILE_APK"
          unzip -t "$CAR_APK"
          unzip -t "$MOBILE_APK"
          sha256sum "$CAR_APK" > car-agent-debug.sha256
          sha256sum "$MOBILE_APK" > mobile-debug.sha256

      - name: Upload WebRTC APKs
        uses: actions/upload-artifact@v4
        with:
          name: BYD-WebRTC-APKs
          path: |
            byd-connected-monitor/car-agent/app/build/outputs/apk/debug/app-debug.apk
            byd-connected-monitor/mobile-app/app/build/outputs/apk/debug/app-debug.apk
            byd-connected-monitor/car-agent-debug.sha256
            byd-connected-monitor/mobile-debug.sha256
          if-no-files-found: error
