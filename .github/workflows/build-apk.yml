name: Build Android APKs

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Unit tests
        run: gradle --no-daemon test

      - name: Lint and build APKs (Car Agent + Mobile)
        run: gradle --no-daemon clean lintDebug :app:assembleDebug :mobile:assembleDebug

      - name: Verify APKs
        run: |
          for module in app mobile; do
            APK="$module/build/outputs/apk/debug/$module-debug.apk"
            test -f "$APK"
            unzip -t "$APK"
            sha256sum "$APK" | tee "$module/build/outputs/apk/debug/$module-debug.apk.sha256"
          done

      - name: Upload Car Agent APK
        uses: actions/upload-artifact@v4
        with:
          name: BYD-Connected-Monitor-CarAgent-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/reports/lint-results-debug.html
          if-no-files-found: error

      - name: Upload Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: BYD-Monitor-Mobile-debug
          path: |
            mobile/build/outputs/apk/debug/mobile-debug.apk
            mobile/build/outputs/apk/debug/mobile-debug.apk.sha256
            mobile/build/reports/lint-results-debug.html
          if-no-files-found: error
