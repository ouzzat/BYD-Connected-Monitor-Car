name: Build Mobile APK

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Lint and build mobile APK
        run: gradle --no-daemon :mobile:clean :mobile:lintDebug :mobile:assembleDebug

      - name: Verify APK
        run: |
          APK="mobile/build/outputs/apk/debug/mobile-debug.apk"
          test -f "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee mobile/build/outputs/apk/debug/mobile-debug.apk.sha256

      - name: Upload mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: BYD-Monitor-Mobile-debug
          path: |
            mobile/build/outputs/apk/debug/mobile-debug.apk
            mobile/build/outputs/apk/debug/mobile-debug.apk.sha256
            mobile/build/reports/lint-results-debug.html
          if-no-files-found: error
