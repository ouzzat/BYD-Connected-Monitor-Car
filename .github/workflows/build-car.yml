name: BYD Car APK

on:
  workflow_dispatch:
  push:
    branches: [ main, agent/android-github-actions ]

permissions:
  contents: read

jobs:
  build-car:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project
        run: |
          base64 -d android-project.zip.b64 > /tmp/byd.zip
          unzip -q /tmp/byd.zip
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Build car APK
        working-directory: byd-connected-monitor
        run: |
          chmod +x gradlew
          ./gradlew :car-agent:app:assembleDebug :car-agent:app:assembleRelease --no-daemon
      - name: Upload car APK
        uses: actions/upload-artifact@v4
        with:
          name: byd-car-apks
          if-no-files-found: error
          path: |
            byd-connected-monitor/car-agent/app/build/outputs/apk/debug/app-debug.apk
            byd-connected-monitor/car-agent/app/build/outputs/apk/release/app-release.apk
