name: BYD Connected Monitor CI/CD

on:
  workflow_dispatch:
  push:
    branches: [ main, agent/android-github-actions ]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          base64 -d android-project.zip.b64 > /tmp/byd-connected-monitor.zip
          unzip -q /tmp/byd-connected-monitor.zip
          test -f byd-connected-monitor/gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Build debug and release APKs
        working-directory: byd-connected-monitor
        run: |
          chmod +x gradlew
          ./gradlew :car-agent:app:assembleDebug :car-agent:app:assembleRelease :mobile-app:app:assembleDebug :mobile-app:app:assembleRelease --no-daemon

      - name: Security checks
        working-directory: byd-connected-monitor
        run: |
          ! grep -RInE 'password[[:space:]]*=[[:space:]]*"[^"]+' --include='*.kt' --include='*.java' .
          ! grep -RInE 'hivemq_password|mqtt_secret' --include='*.kt' --include='*.java' --include='*.xml' .
          ! grep -RIn 'allowBackup="true"' --include='*.xml' .

      - name: Compute checksums
        working-directory: byd-connected-monitor
        run: |
          sha256sum car-agent/app/build/outputs/apk/debug/app-debug.apk > car-agent-debug.sha256
          sha256sum car-agent/app/build/outputs/apk/release/app-release.apk > car-agent-release.sha256
          sha256sum mobile-app/app/build/outputs/apk/debug/app-debug.apk > mobile-debug.sha256
          sha256sum mobile-app/app/build/outputs/apk/release/app-release.apk > mobile-release.sha256

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: byd-connected-monitor-apks
          if-no-files-found: error
          path: |
            byd-connected-monitor/car-agent/app/build/outputs/apk/debug/app-debug.apk
            byd-connected-monitor/car-agent/app/build/outputs/apk/release/app-release.apk
            byd-connected-monitor/mobile-app/app/build/outputs/apk/debug/app-debug.apk
            byd-connected-monitor/mobile-app/app/build/outputs/apk/release/app-release.apk
            byd-connected-monitor/*-debug.sha256
            byd-connected-monitor/*-release.sha256
