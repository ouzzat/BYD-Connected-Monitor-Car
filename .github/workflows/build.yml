name: AutoDashboard Android APK

on:
  workflow_dispatch:
  push:
    branches: [ agent/auto-dashboard-compile ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build AutoDashboard debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract AutoDashboard project
        run: |
          base64 -d android-project.zip.b64 > /tmp/auto-dashboard.zip
          unzip -q /tmp/auto-dashboard.zip
          test -f AutoDashboard/gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
          cache-dependency-path: AutoDashboard/*.gradle.kts

      - name: Build debug APK
        working-directory: AutoDashboard
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Compute checksum
        run: sha256sum AutoDashboard/app/build/outputs/apk/debug/app-debug.apk > AutoDashboard-debug.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoDashboard-v0.3-debug
          if-no-files-found: error
          path: |
            AutoDashboard/app/build/outputs/apk/debug/app-debug.apk
            AutoDashboard-debug.sha256
